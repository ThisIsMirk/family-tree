<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2b2118" />
<title>Perooli Family Tree</title>
<style>
  :root{
    --bg:#f5efe4; --bg2:#efe7d6; --ink:#2b2118; --muted:#7b6f5c;
    --line:#c9bda3; --card:#fffdf8;
    --gold:#b8862f; --gold-soft:#e8d098;
    --warn:#cf7a2e; --warn-soft:#f3d9bd;
    --node:#5b6b78; --accent:#3f5d52;
    --shadow:0 8px 30px rgba(50,38,20,.18);
    --serif:'Iowan Old Style','Palatino Linotype','Palatino',Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:var(--sans);overscroll-behavior:none}
  #stage{position:fixed;inset:0;touch-action:none;background:
    radial-gradient(1200px 800px at 70% -10%, #fbf7ee 0%, var(--bg) 55%, var(--bg2) 100%)}
  svg{width:100%;height:100%;display:block;cursor:grab}
  svg:active{cursor:grabbing}

  /* ---- top bar ---- */
  #top{position:fixed;top:0;left:0;right:0;z-index:20;
    padding:calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px;
    display:flex;gap:8px;align-items:center;
    background:linear-gradient(to bottom, rgba(245,239,228,.98), rgba(245,239,228,.9) 70%, rgba(245,239,228,0))}
  #brand{font-family:var(--serif);font-weight:600;font-size:16px;letter-spacing:.2px;
    white-space:nowrap;color:var(--ink);display:flex;align-items:center;gap:7px}
  #brand .seal{width:22px;height:22px;border-radius:50%;background:
    radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold));
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5);flex:none}
  .search{position:relative;flex:1;min-width:0;max-width:360px}
  .search input{width:100%;border:1px solid var(--line);background:var(--card);
    border-radius:999px;padding:10px 36px 10px 36px;font-size:16px;color:var(--ink);
    outline:none;box-shadow:0 1px 2px rgba(50,38,20,.06)}
  .search input:focus{border-color:var(--gold)}
  .search .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);
    color:var(--muted);font-size:15px;pointer-events:none}
  .search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    border:none;background:#e7dcc6;color:var(--muted);width:22px;height:22px;border-radius:50%;
    font-size:14px;line-height:1;cursor:pointer;display:none}
  #hits{position:absolute;left:0;right:0;top:46px;font-size:12px;color:var(--muted);
    padding-left:14px}

  /* ---- search suggestions dropdown ---- */
  #sugg{position:absolute;left:0;right:0;top:46px;z-index:40;background:var(--card);
    border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    max-height:min(62vh,440px);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none}
  #sugg.open{display:block}
  .sg{padding:9px 14px;cursor:pointer;border-bottom:1px solid #efe7d6}
  .sg:last-child{border-bottom:none}
  .sg.active,.sg:hover{background:var(--bg)}
  .sg-nm{font-family:var(--serif);font-size:15px;color:var(--ink);line-height:1.2}
  .sg-nm mark{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 1px}
  .sg-side{font-family:var(--sans);font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px;
    vertical-align:middle;color:#fff;white-space:nowrap}
  .sg-side.sg-m{background:#d4408a}   /* Mariyomma's side = pink */
  .sg-side.sg-f{background:#3f74cf}   /* Rajab's side = blue */
  .sg-side.sg-b{background:#5a97d6}   /* Nangeri Aboobacker's side = lighter blue */
  .sg-sub{font-size:11.5px;color:var(--muted);margin-top:2px;font-family:var(--sans)}
  .sg-none{padding:11px 14px;font-size:13px;color:var(--muted)}
  .sg-more{padding:8px 14px;font-size:11px;color:var(--muted);text-align:center;
    background:var(--bg);position:sticky;bottom:0}

  /* ---- generation labels (pinned at top, tracked horizontally on zoom) ---- */
  #gens{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top, 0px) + 56px);height:0;z-index:8;
    pointer-events:none}
  .genlbl{position:absolute;transform:translateX(-50%);white-space:nowrap;
    font-family:var(--serif);font-size:12px;letter-spacing:.3px;color:var(--muted);
    background:rgba(245,239,228,.94);
    padding:2px 9px;border-radius:999px;border:1px solid var(--line)}

  /* ---- floating controls ---- */
  #tools{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);z-index:20;
    display:flex;flex-direction:column;gap:10px}
  .tool{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-size:20px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
  .tool#t-in,.tool#t-out{font-size:26px;font-weight:600;line-height:1}
  .homeico{width:27px;height:27px;display:block}
  /* the detail sheet covers the bottom — float the controls/legend up above it (still tappable) */
  #tools,#legend{transition:transform .26s cubic-bezier(.2,.8,.2,1)}
  body.sheet-open #tools,body.sheet-open #legend{transform:translateY(calc(-1 * var(--sheetH,190px) + 4px));z-index:31}
  .desktop-only{display:none}   /* +/- zoom buttons: desktop only (touch devices pinch instead) */

  /* ---- legend chip ---- */
  #legend{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);z-index:20;
    background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
    font-size:11.5px;color:var(--muted);padding:8px 11px;max-width:70vw}
  #legend b{color:var(--ink);font-weight:600}
  #legend .row{display:flex;align-items:center;gap:7px;margin:3px 0;white-space:normal;line-height:1.25}
  #legend .legname{font-family:var(--serif);font-size:12px;color:var(--ink);flex:none;line-height:1}
  .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .dot.norm{background:var(--node)}

  /* ---- tree visuals ---- */
  .genline{stroke:#cdbf9f;stroke-width:1;opacity:.4;vector-effect:non-scaling-stroke}
  .link{fill:none;stroke:var(--line);stroke-width:1.4px}
  /* golden lineage of the open person (colour/width set inline; here = the glow) */
  .link.gold-desc{filter:drop-shadow(0 0 1.6px rgba(232,195,74,.5))}
  .link.gold-anc{filter:drop-shadow(0 0 3px rgba(240,210,90,.7));animation:goldpulse 1.8s ease-in-out infinite}
  /* pulse OPACITY (compositor-cheap) rather than re-rasterizing the drop-shadow filter each frame */
  @keyframes goldpulse{ 0%,100%{opacity:.72} 50%{opacity:1} }
  @media (prefers-reduced-motion:reduce){ .link.gold-anc{animation:none} }
  .node circle{stroke-width:1.6px;cursor:pointer}
  .node .ncol{fill:var(--card);stroke:var(--node)}
  .node.collapsed .ncol{fill:var(--node)}
  .node text{font-family:var(--serif);font-size:13.5px;fill:var(--ink);cursor:pointer;
    paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
  .node.root circle{fill:var(--accent);stroke:var(--accent)}
  .node.root text{font-weight:700;font-size:15px}
  .node.match circle{stroke:#1f7a5a;stroke-width:3px}
  .node.match text{fill:#1f7a5a;font-weight:700}
  /* dual people: pink outline on the mother's-side copy, blue on the father's-side copy */
  .node.side-m circle.ncol{stroke:#d4408a;stroke-width:2.2px}
  .node.side-f circle.ncol{stroke:#3f74cf;stroke-width:2.2px}
  .node.side-b circle.ncol{stroke:#7eb3e8;stroke-width:2.2px}
  .photo{cursor:pointer}
  .photoring{fill:none;stroke:#d4408a;stroke-width:2.2px;cursor:pointer}
  .node.sel .photoring{stroke:#b8862f;stroke-width:2.8px}
  /* side branches greyed out (Mariyomma's line stays in full colour); opacity fade is set inline */
  .node.dim text{fill:#9b9384}
  .node.dim circle.ncol{stroke:#beb6a6;fill:#f3eee3}
  /* the open/selected person: their dot filled gold (high specificity to beat .collapsed/.match/.root/.side/.dim) */
  .node.sel circle.ncol{fill:#e8c34a;stroke:#b8862f;stroke-width:2px}
  .node.sel text{font-weight:700}
  .mlink{stroke:var(--gold);stroke-width:1.3px;stroke-dasharray:2 2}
  /* drawn heart (SVG path, not an emoji — Firefox won't render emoji inside SVG text) */
  .mheart{fill:#c0392b;stroke:var(--bg);stroke-width:2.4px;stroke-linejoin:round;paint-order:stroke}
  .couple:hover .mheart{fill:#a52f24}
  .couple{cursor:pointer}
  .couple .scirc{fill:var(--card);stroke:var(--node);stroke-width:1.6px}
  .couple text.sname{font-family:var(--serif);font-size:13px;fill:#938b7d;text-decoration:underline;
    paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
  .extlink path{fill:none;stroke:var(--gold);stroke-width:2.6px;stroke-linecap:round;stroke-linejoin:round}
  .couple:hover .extlink path{stroke:var(--accent)}

  /* ---- detail bottom sheet ---- */
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;transform:translateY(110%);
    transition:transform .26s cubic-bezier(.2,.8,.2,1);
    background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(50,38,20,.22);
    padding:8px 18px calc(env(safe-area-inset-bottom, 0px) + 20px)}
  #sheet.open{transform:translateY(0)}
  #sheet .grip{width:40px;height:4px;border-radius:2px;background:#ddd2bb;margin:6px auto 12px}
  #sheet .nm{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.15}
  #sheet .dob{display:none;font-family:var(--sans);font-size:12.5px;color:var(--muted);
    margin-top:3px;letter-spacing:.2px}
  #sheet .dob b{font-weight:600;color:var(--ink)}
  #sheet .occ{display:none;font-family:var(--sans);font-size:11px;font-style:italic;
    color:var(--muted);margin-top:2px}
  #sheet .occ::before{content:"💼 ";font-style:normal;font-size:10px;opacity:.75}
  #s-photo{display:none;width:76px;height:76px;border-radius:50%;object-fit:cover;
    border:2px solid var(--gold-soft);box-shadow:0 2px 8px rgba(50,38,20,.18);
    float:left;margin:2px 14px 8px 0;cursor:zoom-in}
  /* married-in spouse shown in the card (no branch) */
  #s-spouse{display:none;align-items:center;gap:11px;clear:both;
    margin:10px 0 2px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
  #s-spouse .sp-photo{width:50px;height:50px;border-radius:50%;object-fit:cover;flex:none;
    border:2px solid var(--gold-soft);cursor:zoom-in}
  #s-spouse .sp-name{font-family:var(--serif);font-size:16px;color:var(--ink);line-height:1.2}
  #s-spouse .sp-rel{display:block;font-family:var(--sans);font-size:11px;color:var(--muted);margin-top:2px}
  #s-spouse .sp-occ{display:block;font-family:var(--sans);font-size:10.5px;font-style:italic;color:var(--muted);margin-top:1px}
  #s-spouse .sp-occ::before{content:"💼 ";font-style:normal;font-size:9.5px;opacity:.75}

  /* tap-to-enlarge photo lightbox (full-screen, circular, responsive) */
  #lightbox{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:rgba(22,16,8,.84);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    padding:max(env(safe-area-inset-top,0px),16px) 16px max(env(safe-area-inset-bottom,0px),16px);
    cursor:zoom-out}
  #lightbox.open{display:flex}
  #lb-img{width:min(82vw,82vh,460px);height:min(82vw,82vh,460px);border-radius:50%;object-fit:cover;
    border:4px solid rgba(255,255,255,.92);box-shadow:0 14px 60px rgba(0,0,0,.55);
    animation:lbpop .22s cubic-bezier(.2,.9,.3,1)}
  @keyframes lbpop{from{transform:scale(.86);opacity:.3}to{transform:scale(1);opacity:1}}
  #lb-close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;
    width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.16);
    color:#fff;font-size:26px;line-height:1;cursor:pointer}
  @media (prefers-reduced-motion:reduce){ #lb-img{animation:none} }
  #sheet .tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px}
  .tag{font-size:11.5px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);
    color:var(--muted);background:var(--bg)}
  .tag.link{color:#6f4e12;border-color:var(--gold-soft);background:#fbf2dc;cursor:pointer}
  .tag.side-m{color:#fff;background:#d4408a;border-color:#d4408a}   /* Mariyomma's Side = pink */
  .tag.side-f{color:#fff;background:#3f74cf;border-color:#3f74cf}   /* Rajab's Side = blue */
  .tag.side-b{color:#fff;background:#5a97d6;border-color:#5a97d6}   /* Nangeri Aboobacker's Side = lighter blue */
  .tag.link.side-m{color:#a3236a;background:#fbe4f0;border-color:#e6a9cd}   /* pink jump link */
  .tag.link.side-f{color:#244b8f;background:#e4ecfb;border-color:#a9c2ea}   /* blue jump link */
  .tag.link.side-b{color:#2a5a86;background:#e8f1fb;border-color:#bcd9f3}   /* light-blue jump link */
  #sheet .note{font-size:13.5px;color:var(--ink);line-height:1.5;margin:8px 0 4px}
  #sheet .meta{font-size:12.5px;color:var(--muted);margin-top:6px}
  #sheet .acts{display:flex;gap:10px;margin-top:14px}
  #sheet .acts button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);
    border-radius:12px;padding:11px;font-size:14px;font-weight:600;cursor:pointer}
  #sheet .acts button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  #sheet .x{position:absolute;right:14px;top:14px;border:none;background:#eee3cd;color:var(--muted);
    width:30px;height:30px;border-radius:50%;font-size:17px;cursor:pointer}

  #hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;
    text-align:center;color:#f3efe6;font-size:13px;pointer-events:none;opacity:.0;
    transition:opacity .4s;background:rgba(60,56,50,.82);
    padding:10px 16px;border-radius:14px;box-shadow:0 4px 18px rgba(40,30,15,.25);
    max-width:80vw}
  @media (min-width:760px){
    #brand{font-size:19px}
    .node text{font-size:13px}
    #legend{max-width:none}
    .desktop-only{display:flex}   /* show +/- zoom on desktop … */
    .mobile-only{display:none}    /* … and hide the whole-tree button there */
  }
</style>
</head>
<body>
  <div id="stage"><svg></svg></div>

  <div id="top">
    <div id="brand"><span class="seal"></span><span class="bn">Perooli Family Tree</span></div>
    <div class="search">
      <span class="mag">⌕</span>
      <input id="q" type="search" placeholder="Search a name…" autocomplete="off" autocorrect="off" />
      <button class="clr" id="clr" aria-label="clear">×</button>
      <div id="hits"></div>
      <div id="sugg" role="listbox"></div>
    </div>
  </div>

  <div id="legend">
    <div class="row"><span class="legname">Aa</span>Tap any <b>name</b> for details</div>
  </div>

  <div id="tools">
    <div class="tool desktop-only" id="t-in" title="Zoom in">+</div>
    <div class="tool desktop-only" id="t-out" title="Zoom out">−</div>
    <div class="tool mobile-only" id="t-full" title="See the whole tree">⤢</div>
    <div class="tool" id="t-home" title="Home — Mariyomma &amp; Assu's family">
      <svg class="homeico" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="5" y="10.8" width="14" height="9.7" rx="1" fill="#f0dfb8" stroke="#9c7b3e" stroke-width="1"/>
        <path d="M12 2.6 1.8 11.4h20.4z" fill="#cf7a2e" stroke="#9c5326" stroke-width="1" stroke-linejoin="round"/>
        <rect x="10.1" y="14.3" width="3.9" height="6.2" rx="0.5" fill="#3f5d52"/>
        <circle cx="13.1" cy="17.5" r="0.5" fill="#e8c34a"/>
        <rect x="6.4" y="12.7" width="2.8" height="2.8" rx="0.4" fill="#9cc2dd" stroke="#6f93ad" stroke-width="0.7"/>
        <rect x="14.8" y="12.7" width="2.8" height="2.8" rx="0.4" fill="#9cc2dd" stroke="#6f93ad" stroke-width="0.7"/>
      </svg>
    </div>
  </div>

  <div id="gens"></div>

  <div id="sheet">
    <button class="x" id="sx">×</button>
    <div class="grip"></div>
    <img id="s-photo" alt="" />
    <div class="nm" id="s-name">—</div>
    <div class="dob" id="s-dob"></div>
    <div class="occ" id="s-occ"></div>
    <div class="tags" id="s-tags"></div>
    <div id="s-spouse"></div>
    <div class="note" id="s-note"></div>
    <div class="meta" id="s-meta"></div>
    <div class="acts">
      <button class="primary" id="s-center">Center on tree</button>
    </div>
  </div>

  <div id="hint">Pinch to zoom · drag to move · tap a name for details</div>

  <div id="lightbox" aria-hidden="true">
    <button id="lb-close" aria-label="Close">×</button>
    <img id="lb-img" alt="" />
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script>
  // Cache-busting loader: always fetch the freshest tree-data.js (it's small), so phones never
  // get stuck on a stale copy after a push. tree-data.js sets window.FAMILY_VER, which we then
  // append to image URLs so photos re-download only when the data/photo set actually changes.
  (function(){
    var s=document.createElement("script");
    s.src="tree-data.js?t="+Date.now();
    s.onload=startApp;
    s.onerror=function(){ document.body.innerHTML='<p style="padding:24px;font-family:sans-serif">Could not load tree-data.js</p>'; };
    document.head.appendChild(s);
  })();
  function startApp(){
    if(!window.FAMILY_DATA){ document.body.innerHTML='<p style="padding:24px;font-family:sans-serif">Could not load tree-data.js</p>'; return; }
    const AV = window.FAMILY_VER ? ("?v="+window.FAMILY_VER) : "";   // image cache-bust token
    function picURL(p){ return p ? p+AV : p; }

    const svg = d3.select("svg");
    const PHOTO_R = 15;   // radius of the circular photo shown on a node
    // shared circular clip for node photos (userSpaceOnUse → clips in each node's local coords)
    svg.append("defs").append("clipPath").attr("id","photoClip").append("circle").attr("r",PHOTO_R);
    const gLink = svg.append("g").attr("class","links");
    const gNode = svg.append("g").attr("class","nodes");
    const container = svg.insert("g",":first-child").attr("class","viewport");
    container.append(()=>gLink.node());
    container.append(()=>gNode.node());
    const gGen = container.insert("g",":first-child").attr("class","gens");  // generation dividers, behind everything

    const NODE_H = 30;     // vertical spacing between siblings
    const LEVEL_W = 216;   // horizontal spacing between generations (room for long names)
    const tree = d3.tree().nodeSize([NODE_H, LEVEL_W])
                          .separation((a,b)=>{
                            let s = (a.parent===b.parent?1:1.5);
                            if(attrs(a).marriage || attrs(b).marriage) s += 2.0; // room for the spouse node
                            s += ((hasPhoto(a)?1:0)+(hasPhoto(b)?1:0)) * 0.35;   // a little breathing room around photo nodes
                            if(sideOf(a)!==sideOf(b)) s += 10;  // big gap between the Mother and Father trees
                            return s;
                          });

    const root = d3.hierarchy(window.FAMILY_DATA);
    let nid = 0;
    root.x0 = 0; root.y0 = 0;
    root.each(d=>{ d._id = ++nid; d._children = d.children; });

    function attrs(d){ return (d.data && d.data.attrs) || {}; }
    function sideOf(d){ while(d && d.depth>1) d=d.parent; return d; }  // the Mother/Father subtree a node belongs to
    function collapseAll(d){ if(d._children){ d.children=null; d._children.forEach(collapseAll); } }
    function expand(d){ if(d._children) d.children = d._children; }

    // Everyone, and helpers to open the tree to a given depth or fully
    collapseAll(root);
    const everyone=[]; (function all(d){ everyone.push(d); (d._children||[]).forEach(all); })(root);
    function expandToDepth(n){ everyone.forEach(d=>{ if(d.depth < n) expand(d); }); }
    function expandAll(){ everyone.forEach(expand); }
    function collapseToTop(){ collapseAll(root); expand(root); (root._children||[]).forEach(expand); }

    // Marriage links across the two sheets (e.g. Rajab ⇄ Mariyomma)
    const marriages={};
    everyone.forEach(d=>{ const m=attrs(d).marriage; if(m){ (marriages[m]=marriages[m]||[]).push(d); } });
    function partnerOf(d){ const m=attrs(d).marriage; return m ? (marriages[m]||[]).find(x=>x!==d)||null : null; }

    // Twin links: people who descend from BOTH sides appear twice — a pink (mother's side) copy and
    // a blue (father's side) copy that share a `twin` id. twinOf() finds a person's other-side copy.
    const twins={};
    everyone.forEach(d=>{ const t=attrs(d).twin; if(t){ (twins[t]=twins[t]||[]).push(d); } });
    function twinOf(d){ const t=attrs(d).twin; return t ? (twins[t]||[]).find(x=>x!==d)||null : null; }
    const SIDE_ORDER={mother:0, father:1, backer:2};
    function twinsOf(d){ const t=attrs(d).twin; return t ? (twins[t]||[]).filter(x=>x!==d).sort((a,b)=>SIDE_ORDER[attrs(a).side]-SIDE_ORDER[attrs(b).side]) : []; }
    function canonicalOf(d){ const t=attrs(d).twin; return t ? (twins[t]||[]).find(x=>attrs(x).side==="mother")||null : null; }
    // the three "sides": mother = Mariyomma (pink, canonical); father = Rajab (blue) and
    // backer = Nangeri Aboobacker (light blue) are the duplicate pointer copies.
    function sideLabel(s){ return s==="father"?"Rajab's Side" : s==="backer"?"Nangeri Aboobacker's Side" : "Mariyomma's Side"; }
    function sideClass(s){ return s==="father"?"side-f" : s==="backer"?"side-b" : "side-m"; }
    function isDup(d){ const s=attrs(d).side; return s==="father"||s==="backer"; }   // a greyed pointer copy
    function hasPhoto(d){ return !!attrs(d).pic && !isDup(d); }   // show photos only on the canonical (Mariyomma-side) copy

    // Highlight the main bloodline: colour every link from a founder down to the couple
    // (pink → Mariyomma, blue → Rajab). Keyed by the link's target node id.
    const lineageColor={};
    everyone.forEach(c=>{ if(attrs(c).color){ let a=c; while(a && a.parent){ lineageColor[a._id]=attrs(c).color; a=a.parent; } } });
    // Emphasise the ENTIRE descent of flagged ancestors (the living family branches)
    const blood = new Set();
    everyone.filter(d=>attrs(d).emph).forEach(r=>(function mark(d){ blood.add(d._id); (d.children||d._children||[]).forEach(mark); })(r));

    // Only the DUPLICATE (blue, father-side) copies under Rajab & Nangeri Aboobacker are greyed and fade
    // outward — they're pointers back to the canonical pink (mother's-side) records. The rest of the
    // genuine tree keeps its normal colour. _off = depth within a duplicate branch (0 = not a duplicate).
    everyone.forEach(d=>{ d._off = isDup(d) ? ((d.parent ? d.parent._off : 0) + 1) : 0; });
    function dimOpacity(d){ return d._off ? Math.max(0.3, 0.8 - 0.08*(d._off-1)) : 1; }

    // Default view: the whole tree, fully expanded
    expandAll();

    // ----- zoom -----
    const zoom = d3.zoom().scaleExtent([0.08, 2.6])
      .on("zoom", e=>{ container.attr("transform", e.transform); layoutGenLabels(e.transform); });
    svg.call(zoom).on("dblclick.zoom", null);
    function viewSize(){ const r=svg.node().getBoundingClientRect(); return [r.width, r.height]; }

    // Apply a zoom transform. By default it glides there smoothly; pass animate=false to snap
    // (used only for the initial boot anchoring, where a glide would look like a stray jump).
    function applyTransform(t, animate){
      if(animate===false){ svg.call(zoom.transform, t); return; }
      svg.transition().duration(720).ease(d3.easeCubicInOut).call(zoom.transform, t);
    }
    function centerOn(d, scale, xfrac, animate){
      const [w,h]=viewSize();
      const s = scale || Math.max(0.5, Math.min(1.1, d3.zoomTransform(svg.node()).k || 0.8));
      const fx = (xfrac==null?0.5:xfrac);
      const t = d3.zoomIdentity.translate(w*fx - d.y*s, h*0.5 - d.x*s).scale(s);
      applyTransform(t, animate);
    }
    function fitNodes(nodes, animate){
      if(!nodes.length) return;
      const xs=nodes.map(n=>n.x), ys=nodes.map(n=>n.y);
      const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
      const [w,h]=viewSize();
      const tw=(y1-y0)+300, th=(x1-x0)+140;   // +space for labels
      const s=Math.min(1.5, Math.max(0.08, 0.94*Math.min(w/tw, h/th)));
      const cx=(y0+y1)/2, cy=(x0+x1)/2;
      const t=d3.zoomIdentity.translate(w*0.46 - cx*s, h/2 - cy*s).scale(s);
      applyTransform(t, animate);
    }
    function fit(){ fitNodes(root.descendants()); }
    // zoom to the living family: Mariyomma + all her descendants, and Assu's branch (the `blood` set)
    function showFamily(animate){ const fam=everyone.filter(d=>blood.has(d._id)); fitNodes(fam.length?fam:root.descendants(), animate); }
    function navigate(target){
      let a=target.parent; while(a){ expand(a); a=a.parent; }
      update(root);
      centerOn(target, 0.85, 0.45);
      openSheet(target);
    }

    // ----- render -----
    let selected=null, matches=new Set();
    function classes(d){
      let c="node";
      if(attrs(d).root) c+=" root";
      if(d._children && !d.children) c+=" collapsed";
      if(matches.has(d)) c+=" match";
      if(d===selected) c+=" sel";
      if(attrs(d).side) c+=" "+sideClass(attrs(d).side);   // pink / blue / light-blue outline by side
      if(d._off) c+=" dim";                                // a greyed duplicate-pointer copy
      return c;
    }
    function label(d){ return d.data.name; }

    function update(source){
      tree(root);
      const nodes = root.descendants();
      const links = root.links();

      const link = gLink.selectAll("path.link").data(links, d=>d.target._id);
      link.enter().append("path").attr("class","link")
        .merge(link)
          .attr("d", d=>diag(d.source,d.target));
      link.exit().remove();
      paintLineage();   // colour the links (steady bloodline + the open person's golden lineage)

      const node = gNode.selectAll("g.node").data(nodes, d=>d._id);
      const ent = node.enter().append("g");
      ent.append("circle").attr("class","ncol").attr("r",5.5)
          .on("click",(e,d)=>{ e.stopPropagation(); openOrRedirect(d); });   // dot opens details (branches never hide)
      ent.append("text").attr("dy","0.32em")
          .on("click",(e,d)=>{ e.stopPropagation(); openOrRedirect(d); });
      // photo: people on Mariyomma's side with a picture get a circular photo in place of the dot
      ent.filter(d=>attrs(d).pic && !isDup(d)).each(function(d){
        const g=d3.select(this);
        g.append("image").attr("class","photo").attr("href",picURL(attrs(d).pic))
          .attr("x",-PHOTO_R).attr("y",-PHOTO_R).attr("width",PHOTO_R*2).attr("height",PHOTO_R*2)
          .attr("clip-path","url(#photoClip)").attr("preserveAspectRatio","xMidYMid slice")
          .on("click",(e)=>{ e.stopPropagation(); openOrRedirect(d); });
        g.append("circle").attr("class","photoring").attr("r",PHOTO_R)
          .on("click",(e)=>{ e.stopPropagation(); openOrRedirect(d); });
      });
      // spouse: a small node (circle + underlined name) joined by a dashed line with ❤️ at its centre.
      // Tapping it jumps to that spouse's real node on the other sheet.
      ent.filter(d=>attrs(d).marriage).each(function(d){
        const p=partnerOf(d); if(!p) return;
        const g=d3.select(this).append("g").attr("class","couple");
        g.append("line").attr("class","mlink").attr("x1",0).attr("y1",8).attr("x2",0).attr("y2",46);
        g.append("path").attr("class","mheart").attr("transform","translate(-8.4,18.46) scale(0.7)")
          .attr("d","M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z");
        g.append("circle").attr("class","scirc").attr("cx",0).attr("cy",50).attr("r",4.5);
        const snm=g.append("text").attr("class","sname").attr("x",9).attr("y",50).attr("dy","0.32em").text(p.data.name);
        // little "external link" glyph after the name so it reads as a tap-to-jump link
        let nw=0; try{ nw=snm.node().getComputedTextLength(); }catch(_){}
        if(!nw) nw=p.data.name.length*7;                 // fallback if not yet laid out
        const ic=g.append("g").attr("class","extlink")
                  .attr("transform","translate("+(9+nw+5)+",43) scale(0.42)");
        ic.append("path").attr("d","M14 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6");  // open box
        ic.append("path").attr("d","M13 3h8v8");                                                  // arrow corner
        ic.append("path").attr("d","M21 3 10 14");                                                // arrow shaft
        g.on("click",(e)=>{ e.stopPropagation(); navigate(p); });
      });

      const all = ent.merge(node);
      all.attr("class", classes)
         .attr("transform", d=>`translate(${d.y},${d.x})`)
         .style("opacity", dimOpacity);
      all.select("circle").attr("r", d=>hasPhoto(d)?0: (attrs(d).root?7: (d._children?6:4.5)));  // hide the dot under a photo
      all.select("text")
          .attr("x", d=>{ const off = hasPhoto(d)? PHOTO_R+5 : 10; return (d.children||d._children)? -off : off; })
          .attr("text-anchor", d=> (d.children||d._children)? "end":"start")
          .text(label);

      node.exit().remove();
      nodes.forEach(d=>{ d.x0=d.x; d.y0=d.y; });
      drawGenerations();
    }
    function diag(s,t){
      return `M${s.y},${s.x}C${(s.y+t.y)/2},${s.x} ${(s.y+t.y)/2},${t.x} ${t.y},${t.x}`;
    }

    // ---- generation columns: faint vertical dividers between depths + "Gen N" labels pinned at the top ----
    // Every node at depth g sits at the same x = g*LEVEL_W (d3 nodeSize), so generations line up as columns —
    // and because both founding families start at depth 1, the dividers line up across the whole page.
    const gensEl=document.getElementById("gens");
    let maxGen=1;
    function drawGenerations(){
      const desc=root.descendants();
      const maxD=Math.max(0, ...desc.map(d=>d.depth));  // deepest depth; Nelliadi (the root) is depth 0 = Gen 1
      maxGen=maxD+1;
      const xs=desc.map(d=>d.x), y0=Math.min(...xs)-80, y1=Math.max(...xs)+80;  // full breadth (vertical) extent
      // a divider on each side of every generation column (depth d column is at x=d*LEVEL_W)
      const lines=gGen.selectAll("line.genline").data(d3.range(0, maxD+2));
      lines.enter().append("line").attr("class","genline").merge(lines)
        .attr("x1", g=>(g-0.5)*LEVEL_W).attr("x2", g=>(g-0.5)*LEVEL_W)
        .attr("y1", y0).attr("y2", y1);
      lines.exit().remove();
      layoutGenLabels();
    }
    function layoutGenLabels(t){
      t = t || d3.zoomTransform(svg.node());
      if(gensEl.childElementCount!==maxGen){   // (re)build the label spans to match the generation count
        gensEl.innerHTML="";
        for(let g=1; g<=maxGen; g++){ const s=document.createElement("span"); s.className="genlbl"; s.textContent="Gen "+g; gensEl.appendChild(s); }
      }
      const [w]=viewSize();
      const tight = LEVEL_W*t.k < 46;          // columns too close together → hide the labels (lines stay)
      [...gensEl.children].forEach((s,i)=>{
        const sx = t.x + (i*LEVEL_W)*t.k;       // label i = Gen (i+1) = depth i, whose column sits at x=i*LEVEL_W
        if(tight || sx<44 || sx>w-8){ s.style.display="none"; }
        else { s.style.display=""; s.style.left=sx+"px"; }
      });
    }

    // Colour the links: the steady bloodline (pink → Mariyomma, blue → Rajab, brown emphasis) plus,
    // when a person is open in the detail sheet, their GOLDEN lineage — a glowing pulse all the way up
    // to the founder, and a thinner, calmer gold down through every descendant. Gold overrides the rest.
    const GOLD="#e8c34a";
    function paintLineage(){
      const selId = selected ? selected._id : null;
      const anc=new Set(), desc=new Set();
      if(selected){
        selected.ancestors().forEach(n=>anc.add(n._id));      // selected + every ancestor up to the founder
        selected.descendants().forEach(n=>desc.add(n._id));   // selected + everyone below
      }
      const isAnc  = d=> anc.has(d.target._id);                          // a link on the upward chain
      const isDesc = d=> !isAnc(d) && desc.has(d.target._id) && d.target._id!==selId;  // a link inside the subtree
      gLink.selectAll("path.link")
        .style("stroke-dasharray",null).style("stroke-dashoffset",null)   // clear any leftover draw-animation state
        .style("transition",null).style("animation-delay",null)
        .classed("gold-anc",  isAnc)
        .classed("gold-desc", isDesc)
        .classed("lineage",   d=> !isAnc(d) && !isDesc(d) && !!(lineageColor[d.target._id] || blood.has(d.target._id)))
        .style("stroke", d=>{
          if(isAnc(d) || isDesc(d)) return GOLD;
          if(d.target._off) return "#c4bcab";   // side branch → grey
          return lineageColor[d.target._id] || (blood.has(d.target._id) ? "#6b5a3e" : null);
        })
        .style("stroke-width", d=>{
          if(isAnc(d))  return "2.4px";   // not thicker than the bloodline (2.6px); the glow carries the emphasis
          if(isDesc(d)) return "1.6px";   // descendants a touch thinner still
          if(d.target._off) return null;
          return lineageColor[d.target._id] ? "2.6px" : (blood.has(d.target._id) ? "2.2px" : null);
        })
        .style("opacity", d=> (isAnc(d)||isDesc(d)) ? 1 : dimOpacity(d.target));   // fade side-branch links
      // stacking order (last raised = on top): bloodline → gold descendants → gold ancestor chain
      gLink.selectAll("path.lineage").raise();
      gLink.selectAll("path.gold-desc").raise();
      gLink.selectAll("path.gold-anc").raise();
      // fill the open person's own dot gold
      gNode.selectAll("g.node").classed("sel", d=> d===selected);
    }

    // Draw the gold lineage on selection: each segment "races" outward from the selected node —
    // up to the founder and down through every descendant — revealing along its own length, staggered
    // by how many generations it sits from the node (so it looks like it emanates from the person).
    function animateLineage(){
      if(!selected) return;
      const STEP=180, DUR=675;   // per-segment stagger + draw duration
      const gold=gLink.selectAll("path.gold-anc, path.gold-desc");
      const queued=[];
      gold.each(function(d){
        const anc=this.classList.contains("gold-anc");
        const dist=anc ? (selected.depth - d.target.depth + 1) : (d.target.depth - selected.depth);
        const delay=Math.max(0,dist-1)*STEP;
        let L=0; try{ L=this.getTotalLength(); }catch(_){}
        if(!L) return;
        const s=this.style;
        s.transition="none";
        s.strokeDasharray=L+"px";
        s.strokeDashoffset=(anc? -L : L)+"px";    // hide it, revealing from the node-side end outward
        if(anc) s.animationDelay=(delay+DUR)+"ms"; // hold the glow-pulse until this segment has drawn
        queued.push({s,delay});
      });
      if(gold.node()) gold.node().getBoundingClientRect();   // one reflow to commit the hidden state
      queued.forEach(q=>{
        q.s.transition="stroke-dashoffset "+DUR+"ms cubic-bezier(.4,.85,.3,1) "+q.delay+"ms";
        q.s.strokeDashoffset="0px";
      });
    }

    // ----- interactions -----
    // detail sheet
    const sheet=document.getElementById("sheet");
    // A father-side (blue) duplicate is just a pointer — tapping it flies to the canonical
    // pink (Perooli / mother's-side) copy instead of opening the duplicate's own card.
    function openOrRedirect(d){
      if(isDup(d)){ const c=canonicalOf(d); if(c){ navigate(c); return; } }   // greyed copy → canonical pink record
      openSheet(d);
    }
    function openSheet(d){
      selected=d; const a=attrs(d);
      document.getElementById("s-name").textContent=d.data.name;
      const dobEl=document.getElementById("s-dob");
      if(a.dob){ dobEl.innerHTML="Born <b>"+esc(a.dob)+"</b>"; dobEl.style.display="block"; }
      else { dobEl.style.display="none"; dobEl.textContent=""; }
      const occEl=document.getElementById("s-occ");
      if(a.occ){ occEl.textContent=a.occ; occEl.style.display="block"; }
      else { occEl.style.display="none"; occEl.textContent=""; }
      // photo: use this copy's pic, or borrow it from a twin copy (only the canonical copy stores it)
      const picNode = a.pic ? d : twinsOf(d).find(x=>attrs(x).pic);
      const photo=document.getElementById("s-photo");
      if(picNode){ photo.src=picURL(attrs(picNode).pic); photo.style.display="block"; }
      else { photo.style.display="none"; photo.removeAttribute("src"); }
      const tags=document.getElementById("s-tags"); tags.innerHTML="";
      const addTag=(t,cls)=>{ const s=document.createElement("span"); s.className="tag"+(cls?" "+cls:""); s.textContent=t; tags.appendChild(s); return s; };
      // spouse: a blood spouse (cross-marriage) keeps the jump chip; a married-in spouse with a
      // photo gets a richer block (circular photo + name) — they have no branch of their own.
      const spEl=document.getElementById("s-spouse"); spEl.style.display="none"; spEl.innerHTML="";
      if(a.spouse){
        const partner=partnerOf(d);
        if(!partner && (a.spousePic || a.spouseDob || a.spouseOcc)){
          spEl.style.display="flex";
          if(a.spousePic){
            const im=document.createElement("img"); im.className="sp-photo"; im.src=picURL(a.spousePic); im.alt=a.spouse;
            im.onclick=(e)=>{ e.stopPropagation(); openLightbox(picURL(a.spousePic)); };
            spEl.appendChild(im);
          }
          const nm=document.createElement("div"); nm.className="sp-name";
          let sub="Spouse"; if(a.spouseDob) sub+=" · b. "+esc(a.spouseDob);
          let html="❤️ "+esc(a.spouse)+'<span class="sp-rel">'+sub+'</span>';
          if(a.spouseOcc) html+='<span class="sp-occ">'+esc(a.spouseOcc)+'</span>';
          nm.innerHTML=html;
          spEl.appendChild(nm);
        } else {
          const chip=addTag("❤️ "+a.spouse+(partner?"  ›":""), partner?"link":"");
          if(partner) chip.onclick=()=>{ closeSheet(); navigate(partner); };
        }
      }
      // side tag for this copy (only people who descend from both sides have one); sheet tag is dropped
      if(a.side) addTag(sideLabel(a.side), sideClass(a.side));
      // a jump button to EACH of this person's other-side copies (a person can appear up to 3×)
      twinsOf(d).forEach(tw=>{ const ts=attrs(tw).side;
        const chip=addTag("⇄ "+sideLabel(ts)+"  ›", "link "+sideClass(ts));
        chip.onclick=()=>{ closeSheet(); navigate(tw); }; });
      const kids=(d.children?d.children.length:0)+(d._children&&!d.children?d._children.length:0);
      if(kids) addTag(kids+" child"+(kids>1?"ren":""));
      document.getElementById("s-note").textContent=a.note||"";
      const path=d.ancestors().reverse().map(n=>n.data.name).filter(n=>n!=="Perooli Family");
      document.getElementById("s-meta").textContent= path.length>1? "Lineage: "+path.join("  ›  ") : "";
      sheet.classList.add("open"); document.body.classList.add("sheet-open");
      document.body.style.setProperty("--sheetH", sheet.getBoundingClientRect().height+"px");  // lift controls above the sheet
      paintLineage();     // light up this person's golden lineage
      animateLineage();   // …and draw it outward from them
    }
    function closeSheet(){ sheet.classList.remove("open"); document.body.classList.remove("sheet-open"); selected=null; paintLineage(); }
    document.getElementById("sx").onclick=closeSheet;
    // Center keeps the person selected (gold lineage stays lit); it just slides the sheet out of the way
    document.getElementById("s-center").onclick=()=>{ const d=selected; if(d){ sheet.classList.remove("open"); document.body.classList.remove("sheet-open"); centerOn(d); } };
    svg.on("click",closeSheet);

    // photo lightbox: tap a card photo to enlarge; tap the backdrop / ✕ / Esc to close
    const lightbox=document.getElementById("lightbox"), lbImg=document.getElementById("lb-img");
    function openLightbox(src){ if(src){ lbImg.src=src; lightbox.classList.add("open"); } }
    function closeLightbox(){ lightbox.classList.remove("open"); lbImg.removeAttribute("src"); }
    document.getElementById("s-photo").addEventListener("click",(e)=>{
      e.stopPropagation(); openLightbox(e.currentTarget.getAttribute("src"));
    });
    lightbox.addEventListener("click", closeLightbox);
    document.addEventListener("keydown",(e)=>{ if(e.key==="Escape" && lightbox.classList.contains("open")) closeLightbox(); });

    // tools
    document.getElementById("t-full").onclick=()=>fit();          // see the whole tree (glides) — mobile
    document.getElementById("t-home").onclick=()=>showFamily(true); // zoom to Mariyomma & Assu's family (glides)
    const zoomBy=f=> svg.transition().duration(200).ease(d3.easeCubicOut).call(zoom.scaleBy, f);
    document.getElementById("t-in").onclick =()=>zoomBy(1.35);    // desktop +
    document.getElementById("t-out").onclick=()=>zoomBy(1/1.35);  // desktop −

    // search — live dropdown of name suggestions, each with its parentage subtitle
    const q=document.getElementById("q"), clr=document.getElementById("clr"),
          hits=document.getElementById("hits"), sugg=document.getElementById("sugg");
    const SUGG_MAX=12;            // how many suggestions to show at once
    let sgList=[], sgActive=-1;

    function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
    function highlight(name, term){
      const i=name.toLowerCase().indexOf(term);
      if(i<0) return esc(name);
      return esc(name.slice(0,i))+"<mark>"+esc(name.slice(i,i+term.length))+"</mark>"+esc(name.slice(i+term.length));
    }
    // "Child of <parent>" — and "<parent> & <parent's spouse>" when the other parent is on file
    function parentLabel(d){
      const p=d.parent;
      if(!p || attrs(p).root) return "";          // founders have no parent in the tree
      let names=p.data.name;
      const sp=attrs(p).spouse;
      if(sp) names+=" & "+sp;
      return "Child of "+names;
    }
    // Rank: names that START with the term first, then names that merely contain it; alpha within each.
    function rankMatches(term){
      const starts=[], contains=[];
      everyone.forEach(d=>{
        if(attrs(d).root) return;
        const i=d.data.name.toLowerCase().indexOf(term);
        if(i===0) starts.push(d); else if(i>0) contains.push(d);
      });
      const byName=(a,b)=>a.data.name.localeCompare(b.data.name);
      return starts.sort(byName).concat(contains.sort(byName));
    }

    function closeSugg(){ sugg.classList.remove("open"); sugg.innerHTML=""; sgList=[]; sgActive=-1; }
    function renderSuggestions(){
      const term=q.value.trim().toLowerCase();
      clr.style.display=term?"block":"none";
      if(!term){ closeSugg(); return; }
      const all=rankMatches(term);
      sgList=all.slice(0,SUGG_MAX); sgActive=-1;
      if(!sgList.length){
        sugg.innerHTML='<div class="sg-none">No matches for &ldquo;'+esc(q.value.trim())+'&rdquo;</div>';
        sugg.classList.add("open"); return;
      }
      let html=sgList.map((d,idx)=>{
        const sub=parentLabel(d);
        const sd=attrs(d).side;   // dual/triple people show a coloured side badge so each copy is distinct
        const sgcls = sd==="father" ? "sg-f" : sd==="backer" ? "sg-b" : "sg-m";
        const badge = sd ? ' <span class="sg-side '+sgcls+'">'+esc(sideLabel(sd))+'</span>' : '';
        return '<div class="sg" data-i="'+idx+'" role="option">'
          +'<div class="sg-nm">'+highlight(d.data.name,term)+badge+'</div>'
          +(sub?'<div class="sg-sub">'+esc(sub)+'</div>':'')
          +'</div>';
      }).join("");
      if(all.length>sgList.length) html+='<div class="sg-more">+'+(all.length-sgList.length)+' more — keep typing to narrow</div>';
      sugg.innerHTML=html;
      sugg.classList.add("open");
    }
    function moveActive(dir){
      if(!sgList.length) return;
      sgActive=(sgActive+dir+sgList.length)%sgList.length;
      const els=sugg.querySelectorAll(".sg");
      els.forEach((el,i)=>el.classList.toggle("active",i===sgActive));
      if(els[sgActive]) els[sgActive].scrollIntoView({block:"nearest"});
    }
    // commit a choice: glow just that node, expand its ancestors, fly to it, open its card
    function chooseSuggestion(d){
      closeSugg();
      hits.textContent="";
      q.blur();
      matches=new Set([d]);
      navigate(d);   // expands ancestors, update(root), centers, opens the detail sheet
    }

    q.addEventListener("input", renderSuggestions);
    q.addEventListener("focus", ()=>{ if(q.value.trim()) renderSuggestions(); });
    q.addEventListener("keydown", e=>{
      if(!sugg.classList.contains("open")) return;
      if(e.key==="ArrowDown"){ e.preventDefault(); moveActive(1); }
      else if(e.key==="ArrowUp"){ e.preventDefault(); moveActive(-1); }
      else if(e.key==="Enter"){
        const d = sgActive>=0 ? sgList[sgActive] : sgList[0];
        if(d){ e.preventDefault(); chooseSuggestion(d); }
      }
      else if(e.key==="Escape"){ closeSugg(); }
    });
    sugg.addEventListener("click", e=>{
      const item=e.target.closest(".sg"); if(!item) return;
      const d=sgList[+item.dataset.i]; if(d) chooseSuggestion(d);
    });
    // tapping anywhere outside the search closes the dropdown (without clearing the text)
    document.addEventListener("click", e=>{ if(!e.target.closest(".search")) closeSugg(); });

    clr.onclick=()=>{ q.value=""; closeSugg(); hits.textContent=""; matches=new Set(); update(root); q.focus(); };

    // boot — fully expanded, opened on the living family (Mariyomma + descendants & Assu); drag/zoom to explore
    function openView(animate){
      const f=root, s=0.8, [w,h]=viewSize();
      applyTransform(d3.zoomIdentity.translate(168 - f.y*s, h*0.5 - f.x*s).scale(s), animate);
    }
    update(root);
    requestAnimationFrame(()=>showFamily(false));
    setTimeout(()=>showFamily(false), 250);   // re-frame once the viewport is sized (snap, no glide)
    const hint=document.getElementById("hint");
    hint.style.opacity=1; setTimeout(()=>hint.style.opacity=0, 3200);
  }
  </script>
</body>
</html>
